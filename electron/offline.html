<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plexi ERP - Connection Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      user-select: none;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      max-width: 440px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .logo-container {
      background-color: #ffffff;
      width: 64px;
      height: 64px;
      border-radius: 1rem;
      margin: 0 auto 1.5rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .logo-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      background-color: #0ea5e9;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn:hover {
      background-color: #0284c7;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 1rem;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .dot {
      width: 6px;
      height: 6px;
      background-color: #ef4444;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="assets/icon.png" alt="Plexi ERP Logo">
    </div>
    <div class="status-badge">
      <span class="dot"></span>
      <span>Factory Server Unreachable</span>
    </div>
    <h1>Connection Interrupted</h1>
    <p>Plexi ERP cannot connect to the central manufacturing server. Verify that your factory workstation is connected to the local network or internet.</p>
    <button class="btn" onclick="retryConnection()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      <span>Retry Connection</span>
    </button>
  </div>

  <script>
    function retryConnection() {
      if (window.electron && typeof window.electron.retryConnection === "function") {
        window.electron.retryConnection();
      } else {
        window.location.reload();
      }
    }

    // Auto-retry connectivity check every 10 seconds
    setInterval(() => {
      if (navigator.onLine) {
        retryConnection();
      }
    }, 10000);
  </script>
</body>
</html>
