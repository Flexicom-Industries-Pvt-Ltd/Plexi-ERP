<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plexi ERP - Connection Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      user-select: none;
      padding-top: 48px;
    }

    /* Custom Frameless Title Bar */
    .titlebar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: #090d16;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
      z-index: 9999;
    }
    .titlebar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 12px;
      -webkit-app-region: no-drag;
      font-size: 12px;
      font-weight: 600;
      color: #f8fafc;
    }
    .titlebar-brand img {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }
    .titlebar-brand .tag {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 400;
    }
    .titlebar-controls {
      display: flex;
      height: 100%;
      -webkit-app-region: no-drag;
    }
    .titlebar-btn {
      width: 44px;
      height: 100%;
      border: none;
      background: transparent;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }
    .titlebar-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    .titlebar-btn.close:hover {
      background: #ef4444;
      color: #ffffff;
    }
    .titlebar-btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 2;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      max-width: 440px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .logo-container {
      background-color: #ffffff;
      width: 64px;
      height: 64px;
      border-radius: 1rem;
      margin: 0 auto 1.5rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .logo-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      background-color: #0ea5e9;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn:hover {
      background-color: #0284c7;
    }
    .btn-secondary {
      background-color: #334155;
      color: #f1f5f9;
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
    }
    .btn-secondary:hover {
      background-color: #475569;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 1rem;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .dot {
      width: 6px;
      height: 6px;
      background-color: #ef4444;
      border-radius: 50%;
    }
    .server-box {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #334155;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .server-label {
      font-weight: 500;
      margin-bottom: 0.5rem;
      word-break: break-all;
    }
    .server-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 0.375rem;
      color: #f8fafc;
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      margin-top: 0.5rem;
      outline: none;
    }
    .server-input:focus {
      border-color: #0ea5e9;
    }
    .actions-row {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <!-- Custom Frameless Titlebar -->
  <div class="titlebar" ondblclick="toggleMaximize()">
    <div class="titlebar-brand">
      <img src="assets/icon.png" alt="Plexi ERP Icon">
      <span>Plexi ERP</span>
      <span class="tag">| Factory Workstation (Offline)</span>
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" onclick="minimizeWindow()" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <button id="btn-maximize" class="titlebar-btn" onclick="toggleMaximize()" title="Maximize" aria-label="Maximize">
        <svg id="icon-maximize" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        </svg>
      </button>
      <button class="titlebar-btn close" onclick="closeWindow()" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="logo-container">
      <img src="assets/icon.png" alt="Plexi ERP Logo">
    </div>
    <div class="status-badge">
      <span class="dot"></span>
      <span>Factory Server Unreachable</span>
    </div>
    <h1>Connection Interrupted</h1>
    <p>Plexi ERP cannot connect to the central manufacturing server. Verify that your factory workstation is connected to the local network or internet.</p>
    
    <button class="btn" onclick="retryConnection()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      <span>Retry Connection</span>
    </button>

    <div class="server-box">
      <div class="server-label">
        Target Server: <strong id="server-display" style="color: #38bdf8;">Loading...</strong>
      </div>
      <div id="settings-panel" style="display: none; margin-top: 0.75rem;">
        <input id="server-url-input" class="server-input" type="url" placeholder="https://plexi-erp-two.vercel.app">
        <div class="actions-row">
          <button class="btn btn-secondary" onclick="saveCustomServer()">Save & Connect</button>
          <button class="btn btn-secondary" onclick="resetDefaultServer()">Reset to Cloud</button>
        </div>
      </div>
      <button id="toggle-settings-btn" class="btn btn-secondary" onclick="toggleSettings()" style="margin-top: 0.75rem;">
        Configure Server URL
      </button>
    </div>
  </div>

  <script>
    let isWindowMaximized = false;

    function minimizeWindow() {
      if (window.electron && typeof window.electron.minimize === "function") {
        window.electron.minimize();
      }
    }

    function toggleMaximize() {
      if (window.electron && typeof window.electron.maximize === "function") {
        window.electron.maximize();
      }
    }

    function closeWindow() {
      if (window.electron && typeof window.electron.close === "function") {
        window.electron.close();
      }
    }

    function updateMaximizeIcon(maximized) {
      isWindowMaximized = maximized;
      const btn = document.getElementById("btn-maximize");
      const icon = document.getElementById("icon-maximize");
      if (!btn || !icon) return;
      if (maximized) {
        btn.setAttribute("title", "Restore");
        btn.setAttribute("aria-label", "Restore");
        icon.innerHTML = '<rect x="4" y="4" width="12" height="12" rx="1"></rect><path d="M8 4V2a1 1 0 0 1 1-1h11a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-2"></path>';
      } else {
        btn.setAttribute("title", "Maximize");
        btn.setAttribute("aria-label", "Maximize");
        icon.innerHTML = '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>';
      }
    }

    async function initWindowControls() {
      if (window.electron) {
        if (typeof window.electron.isMaximized === "function") {
          try {
            const maximized = await window.electron.isMaximized();
            updateMaximizeIcon(maximized);
          } catch {}
        }
        if (typeof window.electron.onMaximizedChange === "function") {
          window.electron.onMaximizedChange((maximized) => {
            updateMaximizeIcon(maximized);
          });
        }
      }
    }

    async function loadServerUrl() {
      if (window.electron && typeof window.electron.getServerUrl === "function") {
        try {
          const url = await window.electron.getServerUrl();
          document.getElementById("server-display").textContent = url;
          document.getElementById("server-url-input").value = url;
        } catch {
          document.getElementById("server-display").textContent = "https://plexi-erp-two.vercel.app";
        }
      } else {
        document.getElementById("server-display").textContent = "https://plexi-erp-two.vercel.app";
      }
    }

    function toggleSettings() {
      const panel = document.getElementById("settings-panel");
      const btn = document.getElementById("toggle-settings-btn");
      if (panel.style.display === "none") {
        panel.style.display = "block";
        btn.textContent = "Cancel";
      } else {
        panel.style.display = "none";
        btn.textContent = "Configure Server URL";
      }
    }

    async function saveCustomServer() {
      const input = document.getElementById("server-url-input").value.trim();
      if (!input) return;
      if (window.electron && typeof window.electron.setServerUrl === "function") {
        await window.electron.setServerUrl(input);
      }
    }

    async function resetDefaultServer() {
      if (window.electron && typeof window.electron.getDefaultServerUrl === "function") {
        const defaultUrl = await window.electron.getDefaultServerUrl();
        document.getElementById("server-url-input").value = defaultUrl;
        await window.electron.setServerUrl(defaultUrl);
      }
    }

    function retryConnection() {
      if (window.electron && typeof window.electron.retryConnection === "function") {
        window.electron.retryConnection();
      } else {
        window.location.reload();
      }
    }

    // Auto-retry connectivity check every 10 seconds
    setInterval(() => {
      if (navigator.onLine) {
        retryConnection();
      }
    }, 10000);

    initWindowControls();
    loadServerUrl();
  </script>
</body>
</html>
